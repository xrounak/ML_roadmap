<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML → LLM Complete Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #0d0d1a;
  --surface2: #12121f;
  --border: #1a1a2e;
  --border2: #252540;
  --text: #d8d8f0;
  --muted: #4a4a6a;
  --muted2: #6a6a8a;
  --white: #f0f0ff;

  --p1: #ff5c5c;
  --p2: #ff8c42;
  --p3: #4ade80;
  --p4: #38bdf8;
  --p5: #c084fc;
  --p6: #facc15;

  --modal-w: 860px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* Animated background */
.bg-noise {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(96,60,220,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 80% 80%, rgba(250,204,21,0.04) 0%, transparent 60%),
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
}

/* ─── Layout ─── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 72px 28px 120px;
}

/* ─── Header ─── */
.hero {
  margin-bottom: 80px;
  animation: fadeUp 0.8s ease both;
}

.hero-pre {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 20px;
}
.hero-pre::before {
  content: '';
  display: block;
  width: 24px;
  height: 1px;
  background: var(--muted2);
}

.hero h1 {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: clamp(44px, 7vw, 88px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.04em;
  color: var(--white);
}

.hero h1 .grad {
  background: linear-gradient(135deg, #facc15 0%, #f97316 40%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  margin-top: 24px;
  font-size: 12px;
  color: var(--muted2);
  line-height: 1.8;
  max-width: 540px;
}

.hero-stats {
  display: flex;
  gap: 40px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-n {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 36px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.04em;
  line-height: 1;
}
.stat-l {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ─── Phase nav ─── */
.phase-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 64px;
  animation: fadeUp 0.8s 0.1s ease both;
}

.pnav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: transparent;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted2);
  transition: all 0.2s;
}
.pnav-btn:hover, .pnav-btn.active {
  border-color: var(--c);
  color: var(--c);
  background: color-mix(in srgb, var(--c) 8%, transparent);
}
.pnav-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
}

/* ─── Phase section ─── */
.phase-section {
  margin-bottom: 80px;
  animation: fadeUp 0.6s ease both;
}

.phase-head {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 8px;
}

.phase-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c);
  opacity: 0.7;
}

.phase-title {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.03em;
}

.phase-desc {
  font-size: 11px;
  color: var(--muted2);
  margin-bottom: 28px;
  line-height: 1.7;
  max-width: 600px;
  padding-left: 2px;
}

/* ─── Project Grid ─── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

/* ─── Project Card ─── */
.pcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: block;
}

.pcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--c);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.pcard::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 0%, color-mix(in srgb, var(--c) 6%, transparent), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.pcard:hover {
  border-color: color-mix(in srgb, var(--c) 40%, transparent);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px color-mix(in srgb, var(--c) 8%, transparent);
}

.pcard:hover::before { transform: scaleX(1); }
.pcard:hover::after { opacity: 1; }

.pcard-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}

.pcard-num {
  font-size: 10px;
  color: var(--c);
  opacity: 0.6;
  letter-spacing: 0.1em;
}

.pcard-open {
  width: 24px;
  height: 24px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, background 0.2s;
}

.pcard:hover .pcard-open {
  border-color: var(--c);
  background: color-mix(in srgb, var(--c) 10%, transparent);
}

.pcard-open svg {
  width: 12px;
  height: 12px;
  stroke: var(--muted2);
  transition: stroke 0.2s;
}
.pcard:hover .pcard-open svg { stroke: var(--c); }

.pcard-title {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
  line-height: 1.3;
  letter-spacing: -0.02em;
}

.pcard-desc {
  font-size: 10.5px;
  color: var(--muted2);
  line-height: 1.75;
  margin-bottom: 14px;
}

.pcard-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.ptag {
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border2);
  color: var(--muted2);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.pcard-key {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--c);
  opacity: 0.75;
  font-style: italic;
}

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 16px;
  width: 100%;
  max-width: var(--modal-w);
  position: relative;
  transform: translateY(20px) scale(0.98);
  transition: transform 0.3s ease;
  overflow: hidden;
}
.modal-overlay.open .modal { transform: none; }

.modal-stripe {
  height: 4px;
  background: var(--c, #7c6aff);
}

.modal-head {
  padding: 32px 36px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.modal-phase-tag {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 20%, transparent);
  padding: 3px 10px;
  border-radius: 3px;
  margin-bottom: 10px;
  display: inline-block;
}

.modal-title {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.modal-num {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 64px;
  font-weight: 800;
  color: var(--c);
  opacity: 0.12;
  letter-spacing: -0.06em;
  line-height: 1;
  flex-shrink: 0;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  font-size: 14px;
  color: var(--muted2);
}
.modal-close:hover {
  background: var(--border);
  color: var(--white);
}

.modal-body {
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

@media (max-width: 680px) {
  .modal-body { grid-template-columns: 1fr; }
  .modal-head { padding: 24px 20px 20px; }
  .modal-num { display: none; }
  .modal-title { font-size: 22px; }
}

.modal-col {
  padding: 28px 36px;
  border-right: 1px solid var(--border);
}
.modal-col:last-child { border-right: none; }
.modal-col.full {
  grid-column: 1 / -1;
  border-top: 1px solid var(--border);
  border-right: none;
}

@media (max-width: 680px) {
  .modal-col { padding: 20px; border-right: none; border-bottom: 1px solid var(--border); }
  .modal-col:last-child { border-bottom: none; }
}

.section-title {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Modal description */
.modal-desc {
  font-size: 11.5px;
  color: var(--muted2);
  line-height: 1.85;
}

/* Skills list */
.skill-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.skill-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 11px;
  color: var(--text);
  line-height: 1.5;
}

.skill-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
  margin-top: 5px;
}

.skill-name {
  font-weight: 500;
  color: var(--white);
}

.skill-detail {
  color: var(--muted2);
  font-size: 10px;
  margin-top: 2px;
}

/* Resource links */
.res-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.res-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  text-decoration: none;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}

.res-item:hover {
  border-color: var(--border2);
  background: var(--surface2);
}

.res-icon {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.res-icon.yt { background: rgba(255,0,0,0.1); }
.res-icon.paper { background: rgba(96,165,250,0.1); }
.res-icon.docs { background: rgba(74,222,128,0.1); }
.res-icon.course { background: rgba(250,204,21,0.1); }
.res-icon.book { background: rgba(192,132,252,0.1); }
.res-icon.github { background: rgba(255,255,255,0.06); }

.res-text {
  flex: 1;
  min-width: 0;
}

.res-name {
  font-size: 11px;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.res-meta {
  font-size: 9px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.05em;
}

.res-arrow {
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
}

/* Hurdles */
.hurdle-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hurdle-item {
  padding: 12px 14px;
  border-radius: 6px;
  border-left: 3px solid;
  background: var(--surface);
}

.hurdle-item.hard { border-color: var(--p1); background: rgba(255,92,92,0.04); }
.hurdle-item.medium { border-color: var(--p2); background: rgba(255,140,66,0.04); }
.hurdle-item.tip { border-color: var(--p3); background: rgba(74,222,128,0.04); }

.hurdle-label {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.7;
}
.hard .hurdle-label { color: var(--p1); }
.medium .hurdle-label { color: var(--p2); }
.tip .hurdle-label { color: var(--p3); }

.hurdle-text {
  font-size: 11px;
  color: var(--text);
  line-height: 1.6;
}

/* Papers */
.paper-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.paper-item {
  padding: 12px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  text-decoration: none;
  display: block;
  transition: border-color 0.2s;
  cursor: pointer;
}

.paper-item:hover {
  border-color: color-mix(in srgb, var(--c) 30%, transparent);
}

.paper-title {
  font-size: 11px;
  color: var(--white);
  line-height: 1.4;
  margin-bottom: 4px;
}

.paper-meta {
  font-size: 9px;
  color: var(--muted2);
  display: flex;
  gap: 10px;
}

.paper-why {
  font-size: 10px;
  color: var(--muted2);
  margin-top: 6px;
  font-style: italic;
  line-height: 1.5;
}

/* Roadmap inside modal */
.roadmap-steps {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.roadmap-step {
  display: flex;
  gap: 16px;
  padding: 10px 0;
  position: relative;
}

.roadmap-step:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 28px;
  bottom: -10px;
  width: 1px;
  background: var(--border2);
}

.step-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--c);
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}

.step-content {}
.step-title {
  font-size: 12px;
  color: var(--white);
  font-weight: 500;
  margin-bottom: 3px;
}
.step-detail {
  font-size: 10px;
  color: var(--muted2);
  line-height: 1.6;
}

/* Modal footer */
.modal-footer {
  padding: 20px 36px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mf-prev, .mf-next {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--muted2);
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: transparent;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s;
  text-decoration: none;
}
.mf-prev:hover, .mf-next:hover {
  border-color: var(--c);
  color: var(--c);
}

.mf-num {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 11px;
  color: var(--muted);
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}

/* Scroll to section highlight */
.phase-section { scroll-margin-top: 40px; }
</style>
</head>
<body>
<div class="bg-noise"></div>

<div class="wrap">
  <!-- Hero -->
  <header class="hero">
    <p class="hero-pre">Complete Project Roadmap</p> <a herf="../note.html">NOTEBOOK</a>
    <h1>ML → DL →<br><span class="grad">Gen AI + LLM</span></h1>
    <p class="hero-sub">
      26 battle-tested projects. Click any card for the full breakdown — skills, resources, YouTube, research papers, step-by-step roadmap, and the exact hurdles you'll hit.
    </p>
    <div class="hero-stats">
      <div class="stat"><div class="stat-n">26</div><div class="stat-l">Projects</div></div>
      <div class="stat"><div class="stat-n">6</div><div class="stat-l">Phases</div></div>
      <div class="stat"><div class="stat-n">12–18</div><div class="stat-l">Months</div></div>
      <div class="stat"><div class="stat-n">40+</div><div class="stat-l">Papers</div></div>
    </div>
  </header>

  <!-- Phase nav -->
  <nav class="phase-nav" id="phase-nav"></nav>

  <!-- Phases rendered by JS -->
  <div id="phases-container"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-stripe" id="modal-stripe"></div>
    <div class="modal-head" id="modal-head">
      <div>
        <div class="modal-phase-tag" id="modal-phase-tag"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <div class="modal-num" id="modal-num"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
const phases = [
  {
    id: 'p1',
    color: '#ff5c5c',
    label: 'Phase 1',
    title: 'Classical ML',
    desc: 'Before touching a neural network, solidify supervised learning fundamentals. These four projects give you the mathematical intuition (loss functions, optimization, generalization) that every deep learning concept rests on.',
    projects: [
      {
        num: '01',
        title: 'House Price Prediction',
        short: 'Linear regression from scratch. Gradient descent by hand. Your first taste of what "learning" means mathematically.',
        tags: ['Linear Regression', 'Gradient Descent', 'NumPy', 'sklearn', 'EDA'],
        keyInsight: 'Implement gradient descent manually before using sklearn — the math must live in your hands',
        skills: [
          { name: 'Linear Regression Math', detail: 'Normal equation, MSE loss, OLS derivation, R²' },
          { name: 'Gradient Descent', detail: 'Batch, stochastic, mini-batch. Learning rate sensitivity.' },
          { name: 'Feature Engineering', detail: 'Scaling (StandardScaler, MinMax), polynomial features, interaction terms' },
          { name: 'Model Evaluation', detail: 'Train/val/test split, cross-validation, bias-variance tradeoff' },
          { name: 'NumPy Mastery', detail: 'Vectorized operations, broadcasting — avoid for loops' },
        ],
        resources: [
          { type: 'yt', icon: '▶', name: 'StatQuest: Linear Regression Clearly Explained', url: 'https://www.youtube.com/watch?v=nk2CQITm_eo', meta: 'StatQuest with Josh Starmer' },

let currentProject = null;
let allProjects = [];

// Flatten all projects for navigation
phases.forEach(ph => {
  ph.projects.forEach(pr => {
    allProjects.push({ ...pr, phaseColor: ph.color, phaseName: ph.label + ' · ' + ph.title });
  });
});

function renderPhaseNav() {
  const nav = document.getElementById('phase-nav');
  phases.forEach(ph => {
    const btn = document.createElement('button');
    btn.className = 'pnav-btn';
    btn.style.setProperty('--c', ph.color);
    btn.innerHTML = `<span class="pnav-dot"></span>${ph.label}: ${ph.title}`;
    btn.onclick = () => {
      document.getElementById(ph.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    nav.appendChild(btn);
  });
}

function renderPhases() {
  const container = document.getElementById('phases-container');
  phases.forEach((ph, pi) => {
    const section = document.createElement('div');
    section.className = 'phase-section';
    section.id = ph.id;
    section.style.setProperty('--c', ph.color);
    section.style.animationDelay = (pi * 0.08) + 's';

    const head = `
      <div class="phase-head">
        <span class="phase-label">${ph.label}</span>
        <span class="phase-title">${ph.title}</span>
      </div>
      <p class="phase-desc">${ph.desc}</p>
    `;

    const grid = document.createElement('div');
    grid.className = 'project-grid';

    ph.projects.forEach((pr, i) => {
      const globalIdx = allProjects.findIndex(p => p.num === pr.num);
      const card = document.createElement('div');
      card.className = 'pcard';
      card.innerHTML = `
        <div class="pcard-top">
          <span class="pcard-num">/ ${pr.num}</span>
          <div class="pcard-open"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17L17 7"/></svg></div>
        </div>
        <div class="pcard-title">${pr.title}</div>
        <div class="pcard-desc">${pr.short}</div>
        <div class="pcard-tags">${pr.tags.map(t => `<span class="ptag">${t}</span>`).join('')}</div>
        ${pr.keyInsight ? `<div class="pcard-key">${pr.keyInsight}</div>` : ''}
      `;
      card.onclick = () => openModal(globalIdx);
      grid.appendChild(card);
    });

    section.innerHTML = head;
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function renderIcon(type) {
  const m = { yt: '▶', paper: '◆', docs: '⬡', course: '⊕', book: '⊞', github: '◎' };
  return m[type] || '→';
}

  footer.style.setProperty('--c', pr.phaseColor);
  const prev = idx > 0 ? allProjects[idx - 1] : null;
  const next = idx < allProjects.length - 1 ? allProjects[idx + 1] : null;
  footer.innerHTML = `
    ${prev ? `<button class="mf-prev" onclick="openModal(${idx-1})">← ${prev.num} ${prev.title}</button>` : '<div></div>'}
    <span class="mf-num">${idx+1} / ${allProjects.length}</span>
    ${next ? `<button class="mf-next" onclick="openModal(${idx+1})">${next.num} ${next.title} →</button>` : '<div></div>'}
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-overlay').onclick = (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight' && currentProject !== null && currentProject < allProjects.length - 1) openModal(currentProject + 1);
  if (e.key === 'ArrowLeft' && currentProject !== null && currentProject > 0) openModal(currentProject - 1);
});

// Init
renderPhaseNav();
renderPhases();
</script>
